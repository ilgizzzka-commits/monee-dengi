<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Деньги Monee: «весы баланса» — две полосы одной длины, как знак «=».
       Верхняя — что есть у бизнеса (деньги, кабинеты, товар),
       нижняя — чьё это (долги и свои). Всё важное — в центральном круге,
       чтобы телефон мог обрезать углы. -->
  <rect width="512" height="512" fill="#1B2431"/>
  <g>
    <rect x="136" y="168" width="120" height="68" rx="16" fill="#54B386"/>
    <rect x="264" y="168" width="48"  height="68" rx="16" fill="#7FA3E3"/>
    <rect x="320" y="168" width="56"  height="68" rx="16" fill="#E0AE55"/>
    <rect x="136" y="276" width="80"  height="68" rx="16" fill="#E07FA6"/>
    <rect x="224" y="276" width="152" height="68" rx="16" fill="#F1F3EE"/>
  </g>
</svg>
